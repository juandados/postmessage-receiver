<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>PostMessage Echo</title>
        <link rel="stylesheet" href="https://unpkg.com/sakura.css/css/sakura.css" />
        <style>
            .message { margin-bottom: 1.5rem; }
            .message img { display: block; max-width: 100%; height: auto; margin: 0.5rem 0; border-radius: 4px; }
            pre { white-space: pre-wrap; word-break: break-word; }
            details summary { cursor: pointer; }
        </style>
    </head>
    <body>
        <h1>PostMessage Messages</h1>
        <div id="messages"></div>
        <script>
            // Optionally restrict which origins are allowed (leave empty to accept all)
            const ALLOWED_ORIGINS = new Set([]);

            // Only handle messages of type "output"
            const ALLOWED_TYPES = new Set(["output"]);

            // Track messages we've already displayed (by stable content key)
            const seen = new Set();
            let count = 0;

            // Build a stable key from the meaningful content of the message,
            // ignoring metadata (e.g., base64 variations, timestamps, etc.)
            function makeStableKey(payload) {
                const type = payload?.type;

                // Normalize critique_output to a fixed shape and key order
                const c = payload?.data?.critique_output || {};
                const stableCritique = {
                    critique: c?.critique ?? "",
                    recommendations: c?.recommendations ?? "",
                    score: c?.score ?? ""
                };

                // If there is a critique_output, use that as the dedup basis
                if (c && (c.critique || c.recommendations || c.score !== undefined)) {
                    return JSON.stringify({ type, critique_output: stableCritique });
                }

                // Fallback: use type + data (but avoid metadata) if no critique_output present
                const stableData = payload?.data ?? null;
                return JSON.stringify({ type, data: stableData });
            }

            window.addEventListener("message", (event) => {
                const origin = event.origin;
                if (ALLOWED_ORIGINS.size > 0 && !ALLOWED_ORIGINS.has(origin)) return;

                const payload = event.data;
                const type = payload?.type;
                if (!ALLOWED_TYPES.has(type)) return;

                const stableKey = makeStableKey(payload);
                if (seen.has(stableKey)) {
                    // Duplicate logical message; ignore rendering the output again
                    return;
                }
                seen.add(stableKey);

                // Render only once per unique critique_output
                count++;

                const container = document.getElementById("messages");
                const section = document.createElement("section");
                section.className = "message";

                const header = document.createElement("h3");
                header.appendChild(document.createTextNode(`Message ${count} (${type}) from ${origin || "unknown origin"}`));
                section.appendChild(header);

                // 1) Show the image from metadata.inputs.url_image_base64 first
                const imgSrc = payload?.metadata?.inputs?.url_image_base64;
                if (typeof imgSrc === "string" && imgSrc.length > 0) {
                    const img = document.createElement("img");
                    img.src = imgSrc; // supports data:image/*;base64,...
                    img.alt = `Message ${count} image`;
                    section.appendChild(img);
                }

                // 2) Then show the output data below
                const outputDisplay = payload?.data ?? {};
                const outputCode = document.createElement("code");
                outputCode.appendChild(document.createTextNode(JSON.stringify(outputDisplay, null, 2)));
                const outputPre = document.createElement("pre");
                outputPre.appendChild(outputCode);
                section.appendChild(outputPre);

                // Optional: keep metadata visible (collapsed)
                const meta = payload?.metadata;
                if (meta) {
                    const details = document.createElement("details");
                    const summary = document.createElement("summary");
                    summary.textContent = "Metadata";
                    details.appendChild(summary);

                    const metaCode = document.createElement("code");
                    metaCode.appendChild(document.createTextNode(JSON.stringify(meta, null, 2)));
                    const metaPre = document.createElement("pre");
                    metaPre.appendChild(metaCode);
                    details.appendChild(metaPre);

                    section.appendChild(details);
                }

                container.appendChild(section);
            });
        </script>
    </body>
</html>
